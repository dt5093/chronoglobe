<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Guess the year from a globe of countries, colonies and capitals between 1900 and today.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronoglobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed globe on a night-sky field; HUD in the top corners; guess console docked at the bottom. Single dark look by choice. */
:root {
  --sky: #0a0f1c;
  --sky-2: #121a2e;
  --ink: #ece4d2;
  --ink-dim: #a39f94;
  --line: rgba(236, 228, 210, 0.14);
  --brass: #e0b45a;
  --brass-ink: #1b1406;
  --good: #8fc79a;
  --panel: rgba(16, 23, 40, 0.86);
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse at 50% 40%, var(--sky-2), var(--sky) 70%);
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }

.hud {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px);
  display: flex; flex-direction: column; gap: 2px; pointer-events: none;
}
.hud.left { left: max(16px, env(safe-area-inset-left, 0px)); }
.hud.right { right: max(16px, env(safe-area-inset-right, 0px)); text-align: right; }
.brand { font-family: var(--f-display); font-size: 30px; line-height: 1; letter-spacing: 0.01em; }
.brand i { color: var(--brass); }
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
.score { font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 5px; margin-top: 6px; }
.pip { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.pip.done { background: var(--brass); }
.pip.now { background: var(--ink); }

.zoomctl {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 96px);
  display: flex; flex-direction: column; gap: 4px;
}
.zoomctl .btn { width: 36px; height: 36px; padding: 0; font-size: 18px; background: var(--panel); }

#tip {
  position: fixed; pointer-events: none; padding: 6px 9px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line); font-size: 13px; line-height: 1.35;
  transform: translate(14px, -50%); white-space: nowrap;
}
#tip b { font-weight: 600; }
#tip span { color: var(--ink-dim); display: block; font-size: 12px; }

.console {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: min(720px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))));
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q { font-family: var(--f-display); font-size: 22px; line-height: 1.1; flex: 1 1 220px; min-width: 0; }
.q em { color: var(--brass); }
.sub { color: var(--ink-dim); font-size: 13px; }

.slider-wrap { position: relative; padding-top: 4px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, #6a5a3c, #8a7a55 45%, var(--brass)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, #6a5a3c, #8a7a55 45%, var(--brass)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: var(--ink); border: 3px solid var(--brass); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid var(--brass); }
input[type=range]:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; border-radius: 4px; }
.ticks { position: relative; height: 14px; font-family: var(--f-mono); font-size: 10px; color: var(--ink-dim); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.marks { position: absolute; left: 0; right: 0; top: 2px; height: 32px; pointer-events: none; }
.mark { position: absolute; top: 0; bottom: 0; width: 2px; transform: translateX(-1px); }
.mark b { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 600 10px var(--f-mono); white-space: nowrap; padding: 1px 4px; border-radius: 3px; }
.mark.truth { background: var(--good); }
.mark.truth b { background: var(--good); color: #0b1a10; }
.mark.guess { background: var(--ink); }
.mark.guess b { background: var(--ink); color: var(--sky); top: 30px; }

.yearbox { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.yearbox input {
  width: calc(4ch + 26px); box-sizing: border-box; background: transparent; border: 0; color: var(--ink); font: 600 20px var(--f-mono);
  padding: 6px 10px; text-align: center; font-variant-numeric: tabular-nums;
}
.yearbox input:focus-visible { outline: none; background: rgba(224, 180, 90, 0.1); }
.nudge { display: flex; gap: 4px; }
button { font-family: var(--f-body); }
.btn {
  border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.btn:hover { border-color: rgba(236, 228, 210, 0.35); }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn.mono { font-family: var(--f-mono); padding: 8px 9px; font-size: 12px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; padding: 10px 18px; font-size: 14px; }
.btn.primary:hover { filter: brightness(1.08); }
.spacer { flex: 1; }

.result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat .v { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat .v.big { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.note { color: var(--ink-dim); font-size: 13px; line-height: 1.45; max-width: 62ch; }

.summary { display: flex; flex-direction: column; gap: 6px; }
.srow { display: grid; grid-template-columns: 2.2em 1fr 1fr 1fr auto; gap: 8px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; padding: 4px 0; border-bottom: 1px solid var(--line); }
.srow.head { color: var(--ink-dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
.srow span:last-child { text-align: right; }
.final { font-family: var(--f-display); font-size: 40px; line-height: 1; }
.final small { font-size: 18px; color: var(--ink-dim); }

#loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--f-display); font-size: 22px; font-style: italic; color: var(--ink-dim); }

.credit { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); font-size: 10px; color: var(--ink-dim); opacity: 0.7; }
.credit a { color: inherit; }

@media (max-width: 640px) {
  .brand { font-size: 24px; }
  .q { font-size: 19px; }
  .result { gap: 8px; }
  .stat .v.big { font-size: 24px; }
  .stat .v { font-size: 16px; }
  .nudge .btn.mono { padding: 8px 7px; }
  .credit { display: none; }
  .ticks span.minor { display: none; }
  .zoomctl { top: calc(env(safe-area-inset-top, 0px) + 84px); }
}
</style>
</head>
<body>
<div id="stage"><canvas id="globe" aria-label="Globe showing countries, borders and capitals at a hidden date between 1900 and 2026. Drag to rotate, scroll or pinch to zoom."></canvas></div>
<div id="loading">Unrolling the map…</div>
<div id="tip" hidden></div>

<div class="hud left">
  <div class="brand">Chrono<i>globe</i></div>
  <div class="eyebrow" id="roundLabel">Round 1 of 5</div>
  <div class="pips" id="pips"></div>
</div>
<div class="hud right">
  <div class="eyebrow">Score</div>
  <div class="score" id="scoreLabel">0</div>
  <div class="eyebrow" id="bestLabel"></div>
</div>
<div class="zoomctl">
  <button class="btn" id="zoomIn" aria-label="Zoom in">+</button>
  <button class="btn" id="zoomOut" aria-label="Zoom out">−</button>
</div>

<div class="console" id="console"></div>
<div class="credit">Borders &amp; capitals: <a href="https://icr.ethz.ch/data/cshapes/" target="_blank" rel="noopener">CShapes 2.0</a> (ETH Zurich, CC BY-NC-SA 4.0) · Coasts: Natural Earth</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Data ----------
const DATA_LAST = 2019; // CShapes ends in 2019; borders and capitals are unchanged since
const ROUNDS = 5;
const MIN_Y = 1900, MAX_Y = 2026;
const PALETTE = ['#c9a66b','#9fb08a','#c48f86','#8fa7bf','#b8a1c9','#d6bf8e','#86b0a4','#b78f6a','#a3b6c9','#c9b28f','#a7c48f','#c9978f'];

const cache = new Map();
function loadJSON(path) {
  if (!cache.has(path)) cache.set(path, fetch(path).then(r => { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }));
  return cache.get(path);
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// d3 wants clockwise exterior rings; repair any polygon that covers more than a hemisphere.
function fixWinding(f) {
  const g = f.geometry; if (!g) return f;
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  for (const p of polys) if (d3.geoArea({ type: 'Polygon', coordinates: p }) > 2 * Math.PI) p.forEach(r => r.reverse());
  return f;
}

// Pick the label anchor inside the polygon's largest piece, not the centroid of scattered islands.
function labelPoint(f) {
  const g = f.geometry;
  if (g.type !== 'MultiPolygon') return d3.geoCentroid(f);
  let best = null, bestA = -1;
  for (const p of g.coordinates) { const poly = { type: 'Polygon', coordinates: p }; const a = d3.geoArea(poly); if (a > bestA) { bestA = a; best = poly; } }
  return d3.geoCentroid(best);
}

// Every territory record carries its start/end date and a list of periods:
// [fromYear, toYear, name, ruler, capitalName, capLon, capLat]
let records = null;
const yearCache = new Map();
async function loadYear(year) {
  if (!records) {
    const topo = await loadJSON('maps/world.json');
    records = topojson.feature(topo, topo.objects.borders).features.filter(f => f.geometry).map(f => {
      fixWinding(f);
      return { f, s: f.properties.s, e: f.properties.e, periods: JSON.parse(f.properties.p), bounds: d3.geoBounds(f), anchor: labelPoint(f), area: d3.geoArea(f) };
    });
  }
  if (yearCache.has(year)) return yearCache.get(year);
  const y = Math.min(year, DATA_LAST), at = y + 0.5; // the world as of 1 July
  const feats = [];
  for (const r of records) {
    if (r.s > at || r.e < at) continue;
    const p = r.periods.find(q => y >= q[0] && y < q[1]); if (!p) continue;
    const [, , name, ruler, capName, lon, lat] = p;
    const owner = ruler || name;
    feats.push({ f: r.f, name, ruler, ruled: !!ruler, color: PALETTE[hash(owner) % PALETTE.length], bounds: r.bounds, anchor: r.anchor, area: r.area,
      capital: capName ? { name: capName, coord: [lon, lat] } : null });
  }
  feats.sort((a, b) => b.area - a.area);
  yearCache.set(year, feats);
  return feats;
}

// ---------- Year helpers ----------
const PIECES = [[0, 1000, 1900, 2026]];
function posToYear(p) { for (const [a, b, ya, yb] of PIECES) if (p <= b) return Math.round(ya + (p - a) / (b - a) * (yb - ya)); return MAX_Y; }
function yearToPos(y) { for (const [a, b, ya, yb] of PIECES) if (y <= yb) return a + (Math.max(y, ya) - ya) / (yb - ya) * (b - a); return 1000; }
// Older maps are coarser and further apart, so allow more slack the further back you go.
function tolerance(y) { return 5 + (2026 - y) * 0.05; }
function scoreFor(guess, truth) { return Math.round(5000 * Math.exp(-Math.abs(guess - truth) / tolerance(truth))); }

// ---------- Globe rendering ----------
const stage = document.getElementById('stage');
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
const projection = d3.geoOrthographic().precision(0.3);
const path = d3.geoPath(projection, ctx);
const graticule = d3.geoGraticule10();
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_ZOOM = 12;

let W = 0, H = 0, DPR = 1, baseScale = 1, zoom = 1;
let rotation = [-20, -25, 0];
let land = null, feats = [], hover = null;
let autoSpin = !reduceMotion, needsDraw = true;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth; H = stage.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  const consoleH = document.getElementById('console').offsetHeight || 160;
  baseScale = Math.max(120, Math.min(W - 24, H - consoleH - 110) / 2);
  needsDraw = true;
}
function globeCenterY() { const consoleH = document.getElementById('console').offsetHeight || 160; return (H - consoleH + 40) / 2 + 10; }

function draw() {
  const s = baseScale * zoom;
  projection.scale(s).translate([W / 2, globeCenterY()]).rotate(rotation);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const [cx, cy] = projection.translate();

  const halo = ctx.createRadialGradient(cx, cy, s * 0.95, cx, cy, s * 1.18);
  halo.addColorStop(0, 'rgba(120,170,220,0.22)'); halo.addColorStop(1, 'rgba(120,170,220,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, s * 1.18, 0, Math.PI * 2); ctx.fill();

  const sea = ctx.createRadialGradient(cx - s * 0.35, cy - s * 0.4, s * 0.1, cx, cy, s);
  sea.addColorStop(0, '#1d4a70'); sea.addColorStop(1, '#0d243b');
  ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = sea; ctx.fill();

  ctx.beginPath(); path(graticule); ctx.strokeStyle = 'rgba(236,228,210,0.07)'; ctx.lineWidth = 0.6; ctx.stroke();

  if (land) { ctx.beginPath(); path(land); ctx.fillStyle = '#2b3a39'; ctx.fill(); }

  for (const p of feats) {
    ctx.beginPath(); path(p.f);
    ctx.fillStyle = p.color; ctx.globalAlpha = hover === p ? 1 : p.ruled ? 0.62 : 0.88; ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); for (const p of feats) path(p.f);
  ctx.strokeStyle = 'rgba(10,15,28,0.6)'; ctx.lineWidth = zoom > 3 ? 1 : 0.7; ctx.stroke();

  if (hover) { ctx.beginPath(); path(hover.f); ctx.strokeStyle = '#ece4d2'; ctx.lineWidth = 1.6; ctx.stroke(); }

  const shade = ctx.createRadialGradient(cx - s * 0.3, cy - s * 0.35, s * 0.2, cx, cy, s * 1.02);
  shade.addColorStop(0, 'rgba(255,255,255,0.06)'); shade.addColorStop(0.7, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = shade; ctx.fill();
  ctx.strokeStyle = 'rgba(236,228,210,0.25)'; ctx.lineWidth = 1; ctx.stroke();

  drawLabels(s);
}

function visible(coord) { return d3.geoDistance(coord, [-rotation[0], -rotation[1]]) < 1.45; }

function drawLabels(s) {
  const placed = [];
  const fits = box => !placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]));
  const halo = (text, x, y) => { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,15,28,0.8)'; ctx.strokeText(text, x, y); ctx.fillText(text, x, y); };
  ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  // Pass 1: capitals (dot + name), biggest countries first.
  const capFont = Math.min(12, 10 + zoom * 0.3);
  for (const p of feats) {
    const c = p.capital; if (!c || !visible(c.coord)) continue;
    const pxArea = p.area * s * s;
    if (pxArea < 260 && zoom < 4) continue;
    const xy = projection(c.coord); if (!xy) continue;
    ctx.font = `500 ${capFont}px "Instrument Sans", system-ui, sans-serif`;
    const w = ctx.measureText(c.name).width;
    const box = [xy[0] - 4, xy[1] - capFont / 2 - 1, xy[0] + 7 + w, xy[1] + capFont / 2 + 1];
    if (!fits(box)) continue;
    placed.push(box);
    ctx.beginPath(); ctx.arc(xy[0], xy[1], 2.6, 0, Math.PI * 2);
    ctx.fillStyle = '#f6f0e2'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#0a0f1c'; ctx.stroke();
    ctx.beginPath(); ctx.arc(xy[0], xy[1], 0.9, 0, Math.PI * 2); ctx.fillStyle = '#0a0f1c'; ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#f6f0e2'; halo(c.name, xy[0] + 6, xy[1]);
  }

  // Pass 2: country names in spaced capitals.
  if ('letterSpacing' in ctx) ctx.letterSpacing = '1px';
  ctx.textAlign = 'center';
  let count = 0;
  for (const p of feats) {
    if (count > 70) break;
    const pxArea = p.area * s * s;
    if (pxArea < 700) continue;
    if (!visible(p.anchor)) continue;
    const xy = projection(p.anchor); if (!xy) continue;
    const size = Math.max(9, Math.min(14, Math.sqrt(pxArea) / 11));
    ctx.font = `600 ${size}px "Instrument Sans", system-ui, sans-serif`;
    const label = (p.name.length > 30 ? p.name.slice(0, 28) + '…' : p.name).toUpperCase();
    const w = ctx.measureText(label).width + label.length, h = size + 2;
    let y = xy[1] + (p.capital ? 0 : 0);
    let box = [xy[0] - w / 2, y - h / 2, xy[0] + w / 2, y + h / 2];
    if (!fits(box)) { y += h + 2; box = [xy[0] - w / 2, y - h / 2, xy[0] + w / 2, y + h / 2]; if (!fits(box)) continue; }
    placed.push(box); count++;
    ctx.fillStyle = p.ruled ? 'rgba(236,228,210,0.7)' : '#ece4d2';
    halo(label, xy[0], y);
  }
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function frame() {
  if (autoSpin) { rotation[0] += 0.05; needsDraw = true; }
  if (needsDraw) { needsDraw = false; draw(); }
  requestAnimationFrame(frame);
}

// ---------- Interaction ----------
const pointers = new Map();
let dragStart = null, pinchStart = null;
function setZoom(z) { zoom = Math.max(0.7, Math.min(MAX_ZOOM, z)); autoSpin = false; needsDraw = true; }
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  autoSpin = false; tip.hidden = true;
  if (pointers.size === 1) { dragStart = { x: e.clientX, y: e.clientY, rot: rotation.slice() }; stage.classList.add('dragging'); }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zoom }; dragStart = null; }
});
stage.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinchStart && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    setZoom(pinchStart.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinchStart.d); return;
  }
  if (dragStart) {
    const k = 75 / (baseScale * zoom);
    rotation = [dragStart.rot[0] + (e.clientX - dragStart.x) * k, Math.max(-85, Math.min(85, dragStart.rot[1] - (e.clientY - dragStart.y) * k)), 0];
    needsDraw = true; return;
  }
  if (e.pointerType === 'mouse') doHover(e.clientX, e.clientY);
});
function endPointer(e) {
  const wasTap = dragStart && Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) < 5;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 0) { dragStart = null; stage.classList.remove('dragging'); }
  if (wasTap && e.pointerType !== 'mouse') doHover(e.clientX, e.clientY);
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointerleave', () => { if (hover) { hover = null; needsDraw = true; } tip.hidden = true; });
stage.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
document.getElementById('zoomIn').onclick = () => setZoom(zoom * 1.5);
document.getElementById('zoomOut').onclick = () => setZoom(zoom / 1.5);

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function doHover(x, y) {
  const s = baseScale * zoom, [cx, cy] = projection.translate();
  let found = null;
  if (Math.hypot(x - cx, y - cy) < s) {
    const ll = projection.invert([x, y]);
    if (ll) for (let i = feats.length - 1; i >= 0; i--) { // smallest first, so enclaves win
      const p = feats[i];
      const [[x0, y0], [x1, y1]] = p.bounds;
      if (ll[1] < y0 || ll[1] > y1) continue;
      if (x0 <= x1 ? (ll[0] < x0 || ll[0] > x1) : (ll[0] < x0 && ll[0] > x1)) continue;
      if (d3.geoContains(p.f, ll)) { found = p; break; }
    }
  }
  if (found !== hover) { hover = found; needsDraw = true; }
  if (found) {
    const lines = [];
    if (found.capital) lines.push(`Capital: ${esc(found.capital.name)}`);
    if (found.ruled) lines.push(`Ruled by ${esc(found.ruler)}`);
    tip.innerHTML = `<b>${esc(found.name)}</b>${lines.map(l => `<span>${l}</span>`).join('')}`;
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.hidden = false;
  } else tip.hidden = true;
}

// ---------- Game ----------
const consoleEl = document.getElementById('console');
let G = null; // { order, i, results, phase, guess }

function newGame() {
  // One map from each of five eras, in random order.
  const buckets = [[1900, 1924], [1925, 1949], [1950, 1974], [1975, 1999], [2000, 2026]];
  const order = d3.shuffle(buckets.map(([a, b]) => a + Math.floor(Math.random() * (b - a + 1))));
  G = { order, i: 0, results: [], phase: 'guess', guess: 1960 };
  startRound();
}

async function startRound() {
  G.phase = 'guess'; G.guess = 1960;
  renderHud(); renderConsole();
  document.getElementById('loading').hidden = false;
  feats = await loadYear(G.order[G.i]);
  document.getElementById('loading').hidden = true;
  rotation = [-(Math.random() * 360 - 180), -(Math.random() * 50 + 5), 0];
  zoom = 1; autoSpin = !reduceMotion; needsDraw = true;
}

function truthYear() { return Number(G.order[G.i]); }
function total() { return G.results.reduce((a, r) => a + r.points, 0); }

let best = 0;
try { best = Number(localStorage.getItem('chronoglobe-1900-best')) || 0; } catch (e) {}

function renderHud() {
  const done = G.phase === 'over';
  document.getElementById('roundLabel').textContent = done ? 'Game complete' : `Round ${G.i + 1} of ${ROUNDS}`;
  document.getElementById('scoreLabel').textContent = total().toLocaleString();
  document.getElementById('bestLabel').textContent = best ? `Best ${best.toLocaleString()}` : '';
  document.getElementById('pips').innerHTML = Array.from({ length: ROUNDS }, (_, k) =>
    `<span class="pip ${k < G.results.length ? 'done' : k === G.i && !done ? 'now' : ''}"></span>`).join('');
}

const TICK_YEARS = [1900, 1914, 1930, 1945, 1960, 1980, 2000, 2026];
function ticksHTML() {
  return TICK_YEARS.map(y => `<span class="${[1914, 1930, 1980].includes(y) ? 'minor' : ''}" style="left:${yearToPos(y) / 10}%">${y}</span>`).join('');
}

function renderConsole() {
  if (G.phase === 'guess') {
    consoleEl.innerHTML = `
      <div class="row">
        <div class="q">What year does this globe show?</div>
        <div class="sub">Somewhere between 1900 and 2026. Hover a country for its capital and ruler.</div>
      </div>
      <div class="slider-wrap">
        <input type="range" id="yearSlider" aria-label="Year" min="0" max="1000" step="1" value="${yearToPos(G.guess)}">
        <div class="ticks">${ticksHTML()}</div>
      </div>
      <div class="row">
        <div class="yearbox"><input id="yearInput" inputmode="numeric" aria-label="Year" value="${G.guess}"></div>
        <div class="nudge">
          <button class="btn mono" data-n="-10">−10</button><button class="btn mono" data-n="-1">−1</button>
          <button class="btn mono" data-n="1">+1</button><button class="btn mono" data-n="10">+10</button>
        </div>
        <span class="spacer"></span>
        <button class="btn primary" id="guessBtn">Lock in ${G.guess}</button>
      </div>`;
    const slider = document.getElementById('yearSlider'), input = document.getElementById('yearInput');
    const sync = (fromSlider) => {
      G.guess = Math.max(MIN_Y, Math.min(MAX_Y, Math.round(G.guess) || MIN_Y));
      if (!fromSlider) slider.value = yearToPos(G.guess);
      if (document.activeElement !== input) input.value = G.guess;
      document.getElementById('guessBtn').textContent = `Lock in ${G.guess}`;
    };
    slider.addEventListener('input', () => { G.guess = posToYear(+slider.value); sync(true); });
    input.addEventListener('input', () => {
      const n = parseInt(input.value.replace(/\D/g, ''), 10);
      if (n >= MIN_Y && n <= MAX_Y) { G.guess = n; sync(false); }
    });
    input.addEventListener('blur', () => { input.value = G.guess; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { input.blur(); submitGuess(); } });
    consoleEl.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { G.guess += Number(b.dataset.n); sync(false); });
    document.getElementById('guessBtn').onclick = submitGuess;
  } else if (G.phase === 'reveal') {
    const r = G.results[G.results.length - 1];
    const off = Math.abs(r.guess - r.truth);
    const verdict = off === 0 ? 'Dead on.' : r.points >= 4000 ? 'A seasoned cartographer.' : r.points >= 2500 ? 'Close enough to sail by.' : r.points >= 1000 ? 'Right era, wrong decades.' : 'Lost at sea.';
    const last = G.i === ROUNDS - 1;
    const label = `<em>${r.truth}</em>`;
    consoleEl.innerHTML = `
      <div class="row"><div class="q">${verdict} This globe shows ${label}.</div></div>
      <div class="slider-wrap" aria-hidden="true">
        <input type="range" min="0" max="1000" value="${yearToPos(r.truth)}" disabled style="opacity:.35">
        <div class="marks">
          <div class="mark truth" style="left:${yearToPos(r.truth) / 10}%"><b>${r.truth}</b></div>
          <div class="mark guess" style="left:${yearToPos(r.guess) / 10}%"><b>${r.guess}</b></div>
        </div>
        <div class="ticks" style="margin-top:24px">${ticksHTML()}</div>
      </div>
      <div class="result">
        <div class="stat"><div class="eyebrow">Your guess</div><div class="v">${r.guess}</div></div>
        <div class="stat"><div class="eyebrow">Off by</div><div class="v">${off} yr${off === 1 ? '' : 's'}</div></div>
        <div class="stat"><div class="eyebrow">Points</div><div class="v big">${r.points.toLocaleString()}</div></div>
      </div>
      <div class="row">
        <div class="note">Spin the globe again to spot the clue you missed.</div>
        <span class="spacer"></span>
        <button class="btn primary" id="nextBtn">${last ? 'See final score' : 'Next globe'}</button>
      </div>`;
    document.getElementById('nextBtn').onclick = () => {
      if (last) { G.phase = 'over'; endGame(); }
      else { G.i++; startRound(); }
    };
    document.getElementById('nextBtn').focus({ preventScroll: true });
  } else {
    const t = total();
    consoleEl.innerHTML = `
      <div class="row">
        <div><div class="eyebrow">Final score</div><div class="final">${t.toLocaleString()} <small>/ ${(ROUNDS * 5000).toLocaleString()}</small></div></div>
        <span class="spacer"></span>
        <div class="note">${t >= best && t > 0 ? 'A new personal best.' : `Your best is ${best.toLocaleString()}.`}</div>
      </div>
      <div class="summary">
        <div class="srow head"><span>#</span><span>Globe</span><span>Guess</span><span>Off by</span><span>Points</span></div>
        ${G.results.map((r, k) => `<div class="srow"><span>${k + 1}</span><span>${r.truth}</span><span>${r.guess}</span><span>${Math.abs(r.guess - r.truth)}</span><span>${r.points.toLocaleString()}</span></div>`).join('')}
      </div>
      <div class="row"><div class="note">Each globe shows the world on 1 July of a random year between 1900 and 2026.</div><span class="spacer"></span><button class="btn primary" id="againBtn">Play again</button></div>`;
    document.getElementById('againBtn').onclick = newGame;
  }
  resize();
}

function submitGuess() {
  if (G.phase !== 'guess') return;
  const truth = truthYear();
  G.results.push({ key: G.order[G.i], truth, guess: G.guess, points: scoreFor(G.guess, truth) });
  G.phase = 'reveal'; needsDraw = true;
  renderHud(); renderConsole();
}

function endGame() {
  const t = total();
  if (t > best) { best = t; try { localStorage.setItem('chronoglobe-1900-best', String(t)); } catch (e) {} }
  renderConsole(); renderHud();
}

// ---------- Boot ----------
window.addEventListener('resize', resize);
async function start(saved) {
  resize(); requestAnimationFrame(frame);
  loadJSON('maps/land.json').then(topo => { land = topojson.feature(topo, topo.objects.land); needsDraw = true; }).catch(() => {});
  if (saved && saved.G && saved.G.order && saved.G.order.every(k => typeof k === 'number')) {
    G = saved.G;
    feats = await loadYear(G.order[G.i]);
    document.getElementById('loading').hidden = true;
    renderHud(); renderConsole(); needsDraw = true;
  } else {
    newGame();
  }
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
